<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Játékosok | FK Partizan Kupuszina</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira+Extra+Condensed:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body data-page="players">
  <main>
    <section class="page-head">
      <div class="wrap">
        <span class="eyebrow">Felnőtt csapat</span>
        <h1>Játékosok</h1>
        <p>A felnőtt csapat kerete posztok szerint.</p>
      </div>
    </section>
    <section class="section" id="stats-section" hidden>
      <div class="wrap"><div class="stats" id="stats"></div></div>
    </section>
    <div class="wrap" id="groups"></div>
  </main>

  <script src="data.js?v=3"></script>
  <script src="players.js?v=4"></script>
  <script src="layout.js?v=3"></script>
  <script>
    // Szezon-statisztika az eredményekből
    if (SITE.results.length) {
      const r = SITE.results;
      const gy = r.filter(x => x.gf > x.ga).length;
      const d = r.filter(x => x.gf === x.ga).length;
      const gf = r.reduce((s, x) => s + x.gf, 0), ga = r.reduce((s, x) => s + x.ga, 0);
      const stats = document.getElementById("stats");
      [["Mérkőzés", r.length], ["Győzelem", gy], ["Döntetlen", d], ["Vereség", r.length - gy - d], ["Gólarány", `${gf}:${ga}`]]
        .forEach(([l, v]) => stats.append(el("div", { class: "stat" }, el("span", { class: "eyebrow", text: l }), el("strong", { text: v }))));
      document.getElementById("stats-section").hidden = false;
    }

    const LINES = [
      ["Kapusok", ["Kapus"]],
      ["Hátvédek", ["Középső hátvéd", "Szélső hátvéd"]],
      ["Középpályások", ["Középpályás", "Támadó középpályás"]],
      ["Támadók", ["Szélső támadó", "Csatár"]]
    ];
    const shirt = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 5.5 2.5 10l3 1.2V21h13v-9.8l3-1.2L20 5.5 16 3c-.6 1.6-2.2 2.6-4 2.6S8.6 4.6 8 3Z"/></svg>';

    const groups = document.getElementById("groups");
    LINES.forEach(([title, positions]) => {
      const list = PLAYERS.filter(p => positions.includes(p.pos));
      const ul = el("ul", { class: "cards" });
      list.forEach(p => {
        const photo = el("div", { class: "photo" });
        if (p.photo) photo.append(el("img", { src: p.photo, alt: p.name, loading: "lazy" }));
        else photo.innerHTML = shirt;
        ul.append(el("li", { class: "card" }, photo,
          el("div", { class: "info" }, el("p", { class: "name", text: p.name }), el("p", { class: "pos", text: p.pos }))));
      });
      groups.append(el("section", { class: "group" },
        el("span", { class: "eyebrow", text: list.length + " játékos" }), el("h2", { text: title }), ul));
    });
  </script>
</body>
</html>
