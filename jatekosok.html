<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keret | FK Kupusina Partizan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">FK Kupusina Partizan</a>
      <nav aria-label="Fő menü">
        <ul class="nav">
          <li><a href="index.html">Főoldal</a></li>
          <li><a href="jatekosok.html" aria-current="page">Keret</a></li>
          <li><a href="index.html#merkozesek">Mérkőzések</a></li>
          <li><a href="index.html#kapcsolat">Kapcsolat</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="page-head">
    <div class="wrap">
      <h1>A keret</h1>
      <p>Az FK Kupusina Partizan játékosai posztok szerint.</p>
    </div>
  </section>

  <main class="wrap">
    <div class="filters" role="group" aria-label="Szűrés poszt szerint" id="filters"></div>
    <div id="groups"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; 2026 FK Kupusina Partizan</span>
      <span>Kupuszin, Szerbia</span>
    </div>
  </footer>

  <script src="players.js"></script>
  <script>
    const LINES = [
      { title: "Kapusok", positions: ["Kapus"] },
      { title: "Védők", positions: ["Középső hátvéd", "Szélső hátvéd"] },
      { title: "Középpályások", positions: ["Középpályás", "Támadó középpályás"] },
      { title: "Támadók", positions: ["Szélső támadó", "Csatár"] }
    ];

    const groupsEl = document.getElementById("groups");
    const filtersEl = document.getElementById("filters");

    function initials(name) {
      return name.split(" ").map(w => w[0]).slice(0, 2).join("");
    }

    LINES.forEach(line => {
      const list = PLAYERS.filter(p => line.positions.includes(p.pos));
      const section = document.createElement("section");
      section.className = "group";
      section.dataset.line = line.title;

      const h2 = document.createElement("h2");
      h2.textContent = line.title;
      const small = document.createElement("small");
      small.textContent = list.length + " játékos";
      h2.appendChild(small);
      section.appendChild(h2);

      const ul = document.createElement("ul");
      ul.className = "cards";
      list.forEach(p => {
        const li = document.createElement("li");
        li.className = "card";
        const photo = document.createElement("div");
        photo.className = "photo";
        if (p.photo) {
          const img = document.createElement("img");
          img.src = p.photo;
          img.alt = p.name;
          img.loading = "lazy";
          photo.appendChild(img);
        } else {
          const ini = document.createElement("span");
          ini.className = "initials";
          ini.setAttribute("aria-hidden", "true");
          ini.textContent = initials(p.name);
          photo.appendChild(ini);
        }
        const info = document.createElement("div");
        info.className = "info";
        const name = document.createElement("p");
        name.className = "name";
        name.textContent = p.name;
        const pos = document.createElement("p");
        pos.className = "pos";
        pos.textContent = p.pos;
        info.append(name, pos);
        li.append(photo, info);
        ul.appendChild(li);
      });
      section.appendChild(ul);
      groupsEl.appendChild(section);
    });

    const options = ["Mind", ...LINES.map(l => l.title)];
    options.forEach((opt, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = opt;
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", () => {
        filtersEl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        groupsEl.querySelectorAll(".group").forEach(g => {
          g.hidden = opt !== "Mind" && g.dataset.line !== opt;
        });
      });
      filtersEl.appendChild(b);
    });
  </script>
</body>
</html>
