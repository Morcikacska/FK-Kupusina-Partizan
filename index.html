<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FK Partizan Kupuszina</title>
  <meta name="description" content="Az FK Partizan Kupuszina focicsapat oldala: mérkőzések, eredmények, hírek és a keret.">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira+Extra+Condensed:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body data-page="home">
  <main>
    <section class="hero">
      <div class="hero-pitch" aria-hidden="true"></div>
      <div class="wrap hero-grid">
        <img class="hero-crest" src="logo.png" alt="Az FK Partizan Kupuszina címere" width="512" height="512">
        <div>
        <span class="eyebrow" id="hero-eyebrow"></span>
        <h1><span id="hero-a" style="color:inherit"></span><span id="hero-b"></span></h1>
        <p id="hero-intro"></p>
        <div class="actions">
          <a class="btn" href="jatekosok.html">Csapatkeret</a>
          <a class="btn btn--ghost" href="kapcsolat.html">Kapcsolat</a>
        </div>
        </div>
      </div>
    </section>

    <section class="section" id="kovetkezo">
      <div class="wrap">
        <span class="eyebrow" id="next-eyebrow">Mérkőzés</span>
        <h2>Következő mérkőzés</h2>
        <div id="next-match"></div>
      </div>
    </section>

    <section class="section">
      <div class="wrap two-col">
        <div>
          <span class="eyebrow">Forma</span>
          <h2>Legutóbbi eredmények</h2>
          <div id="results"></div>
          <span class="eyebrow sub-title">Következő fordulók</span>
          <div id="fixtures"></div>
        </div>
        <div>
          <span class="eyebrow" id="league-eyebrow">Bajnokság</span>
          <h2>Tabella</h2>
          <div id="table"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="news-head">
          <div>
            <span class="eyebrow">Klubhírek</span>
            <h2>Legfrissebb hírek</h2>
          </div>
          <a class="more" href="hirek.html">Összes hír</a>
        </div>
        <div id="news"></div>
      </div>
    </section>

    <section class="cta">
      <div class="hero-pitch" aria-hidden="true"></div>
      <div class="wrap">
        <h2>Gyere ki a következő meccsre</h2>
        <p>A hazai mérkőzéseket a kupuszini pályán játsszuk. Hozd a családot és a barátokat is.</p>
        <a class="btn" href="kapcsolat.html">Kapcsolatfelvétel</a>
      </div>
    </section>
  </main>

  <script src="data.js?v=3"></script>
  <script src="layout.js?v=3"></script>
  <script>
    const C = SITE.club;

    // Hero
    document.getElementById("hero-eyebrow").textContent =
      [C.league, C.founded && "Alapítva " + C.founded].filter(Boolean).join(" · ") || C.town;
    document.getElementById("hero-a").textContent = C.shortA;
    document.getElementById("hero-b").textContent = C.shortB;
    document.getElementById("hero-intro").textContent = C.intro;
    if (C.heroPhoto) {
      const bg = el("div", { class: "hero-bg", "aria-hidden": "true" });
      bg.style.backgroundImage = `url("${C.heroPhoto}")`;
      document.querySelector(".hero").prepend(bg);
      document.querySelector(".hero .hero-pitch").remove();
    }
    if (C.league) document.getElementById("league-eyebrow").textContent = C.league;

    // Következő mérkőzés
    const nm = SITE.nextMatch;
    const nextBox = document.getElementById("next-match");
    if (!nm) {
      nextBox.append(emptyBox("Még nincs kiírva a következő mérkőzés. Amint megvan a sorsolás, itt látod az időpontot, a helyszínt és az ellenfelet."));
    } else {
      if (nm.round) document.getElementById("next-eyebrow").textContent = [C.league, nm.round].filter(Boolean).join(" · ");
      const us = el("div", { class: "team" }, el("img", { src: "logo.png", alt: "" }), el("strong", { text: C.name }));
      const them = el("div", { class: "team" }, el("span", { class: "badge", text: initials(nm.opponent.replace(/^FK\s+/i, "")) }), el("strong", { text: nm.opponent }));
      const [left, right] = nm.home ? [us, them] : [them, us];

      const cd = el("div", { class: "countdown", role: "timer", "aria-label": "Hátralévő idő a kezdésig" });
      const units = [["nap", 86400], ["óra", 3600], ["perc", 60], ["mp", 1]].map(([label, s]) => {
        const strong = el("strong", { text: "00" });
        cd.append(el("div", {}, strong, el("span", { text: label })));
        return [strong, s];
      });
      const target = new Date(nm.date).getTime();
      function tick() {
        let left = Math.max(0, Math.floor((target - Date.now()) / 1000));
        units.forEach(([node, s]) => { node.textContent = String(Math.floor(left / s)).padStart(2, "0"); left %= s; });
      }
      tick();
      setInterval(tick, 1000);

      nextBox.append(el("div", { class: "match" },
        el("div", { class: "match-top" },
          el("span", { class: "eyebrow", text: [C.league, nm.round].filter(Boolean).join(" · ") || "Bajnoki mérkőzés" }),
          el("span", { class: "eyebrow", text: nm.home ? "Hazai pálya" : "Idegenben" })),
        el("div", { class: "teams" }, left, el("span", { class: "vs", text: "VS" }), right),
        el("div", { class: "match-bottom" }, cd,
          el("div", { class: "match-meta" }, el("div", { text: longDate(nm.date) }), nm.venue ? el("div", { text: nm.venue }) : null))));
    }

    // Eredmények
    const resBox = document.getElementById("results");
    if (!SITE.results.length) {
      resBox.append(emptyBox("Még nincs rögzített eredmény."));
    } else {
      const rows = el("div", { class: "rows" });
      SITE.results.slice(0, 6).forEach(r => {
        const [cls, code, word] = resultCode(r);
        rows.append(el("div", { class: "row" },
          el("span", { class: "date", text: shortDate(r.date) }),
          el("span", { class: "res res--" + cls, text: code, title: word }),
          el("span", { class: "opp", text: `${r.home ? "Hazai" : "Idegenben"} · ${r.opponent}` }),
          el("span", { class: "score", text: `${r.gf}–${r.ga}` })));
      });
      resBox.append(rows);
    }

    // Következő fordulók
    const fixBox = document.getElementById("fixtures");
    if (!SITE.fixtures.length) {
      fixBox.append(emptyBox("A további fordulók a sorsolás után kerülnek ide."));
    } else {
      const rows = el("div", { class: "rows" });
      SITE.fixtures.slice(0, 5).forEach(f => rows.append(el("div", { class: "row row--fixture" },
        el("span", { class: "date", text: shortDate(f.date) }),
        el("span", { class: "opp", text: f.opponent }),
        el("span", { class: "where", text: f.home ? "Hazai" : "Idegenben" }))));
      fixBox.append(rows);
    }

    // Tabella
    const tBox = document.getElementById("table");
    if (!SITE.table.length) {
      tBox.append(emptyBox("A tabella a bajnokság indulása után jelenik meg itt."));
    } else {
      const tbody = el("tbody");
      SITE.table.forEach((t, i) => tbody.append(el("tr", { class: t.team === C.name ? "us" : null },
        el("td", { text: i + 1 }), el("td", { text: t.team }), el("td", { text: t.m }), el("td", { text: t.gy }),
        el("td", { text: t.d }), el("td", { text: t.v }), el("td", { text: `${t.gf}:${t.ga}` }))));
      const head = el("tr");
      ["#", "Csapat", "M", "GY", "D", "V", "Gólok"].forEach(h => head.append(el("th", { scope: "col", text: h })));
      tBox.append(el("div", { class: "table-wrap" }, el("table", {}, el("thead", {}, head), tbody)));
    }

    // Hírek
    const nBox = document.getElementById("news");
    if (!SITE.news.length) {
      nBox.append(emptyBox("Még nincs hír. Az első meccsbeszámoló vagy klubhír ide kerül."));
    } else {
      const grid = el("div", { class: "news-grid" });
      SITE.news.slice(0, 3).forEach(n => grid.append(newsCard(n)));
      nBox.append(grid);
    }
  </script>
</body>
</html>
